<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <img src="cfd.png" alt="">
</body>
</html>
